# TCP pass-through: no HTTP parsing, credentials, header rewriting or signing.
# Public URL must be http://[MD_MESH_IP]:7711/mcp in the agent configuration.
global
    log stdout format raw local0
    maxconn 64

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend mesh_mcp
    bind "[${MD_MESH_IP}]:7711"
    default_backend local_mcp

backend local_mcp
    server agent 127.0.0.1:7710
