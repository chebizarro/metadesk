# Rootless Podman reference: namespace and keep-ID mapping owned by the
# ah9-5-netns holder, which mesh-netns.sh (Podman) creates; Compose never does.
# Not a Docker-qualified manifest (Docker cannot join a sibling user namespace).
# See reference/mesh-validation.md for exact versions, setup and evidence.
# md-ba4: Podman <5.4 compat API reports a container's NetworkID as the network
# name, so Compose always saw a holder attached through `networks:` as diverged.
# It stopped the holder, failed removal (dependents) and left consumers without
# an underlay. With no service on a Compose network, plain `up -d` is a no-op.
name: ah9-5
x-sandbox: &sandbox
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: on-failure
  stop_grace_period: 5s

services:
  # No holder service: run `mesh-netns.sh up` first. A missing holder fails
  # container creation; Podman refuses to remove it while consumers exist.
  mesh:
    <<: *sandbox
    image: ${FIPS_IMAGE:?locally built pinned fipsd image}
    container_name: ah9-5-mesh
    network_mode: container:ah9-5-netns
    userns_mode: container:ah9-5-netns
    user: "0:777"
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    tmpfs: ["/run/fips:rw,nosuid,nodev,noexec,mode=0750,U"]
    volumes:
      - type: bind
        source: ${FIPS_CONFIG:?private daemon YAML with persistent identity and UDP peers}
        target: /etc/fips/fips.yaml
        read_only: true
        bind: {create_host_path: false}

  agent:
    <<: *sandbox
    image: ${MD_AGENT_IMAGE:?Tier A runtime image}
    container_name: ah9-5-agent
    network_mode: container:ah9-5-netns
    userns_mode: container:ah9-5-netns
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /run/user/1000:rw,nosuid,nodev,noexec,mode=0700,U
    volumes:
      - type: bind
        source: ${SESSION_BUS_SOCKET:-/run/user/1000/bus}
        target: /run/user/1000/bus
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AT_SPI_DIR:?discovered AT-SPI directory}
        target: ${AT_SPI_DIR:?discovered AT-SPI directory}
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MCP_TOKEN_FILE:?desktop-owned mode-0600 bearer file}
        target: /run/secrets/mcp-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MCP_ALLOW_FILE:?authorized npubs only - no secret keys}
        target: /run/secrets/mcp-allow
        read_only: true
        bind: {create_host_path: false}
    command:
      - /opt/metadesk/bin/metadesk-host
      - --mcp-http
      - "7710"
      - --mcp-http-bind
      - "127.0.0.1"
      - --no-input
      - --mcp-token-file
      - /run/secrets/mcp-token
      - --mcp-public-url
      - http://[${MD_MESH_IP:?stable FIPS IPv6}]:7711/mcp
      - --mcp-allow-file
      - /run/secrets/mcp-allow
    # Deliberately no FIPS control directory or daemon keys.

  proxy:
    <<: *sandbox
    image: ${FIPS_IMAGE:?locally built pinned fipsd image}
    container_name: ah9-5-proxy
    depends_on: [mesh, agent]
    network_mode: container:ah9-5-netns
    userns_mode: container:ah9-5-netns
    user: "1000:1000"
    environment:
      MD_MESH_IP: ${MD_MESH_IP:?stable FIPS IPv6}
    volumes:
      - type: bind
        source: ./mesh-proxy.cfg
        target: /etc/haproxy/mesh.cfg
        read_only: true
    command: [haproxy, -W, -db, -f, /etc/haproxy/mesh.cfg]
    # If mesh has not assigned its address yet, bind fails and restart retries.
    # Never stop/restart the holder under consumers: Podman allows it and they
    # lose the underlay. Replace it only after `down` (see mesh-validation.md).
